[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

# FastAPI: HTTP on 8000 (internal) + gRPC on 50051 (internal)
# It inherits the full container env from Render (GEMINI_API_KEY, REDIS_URL, etc.)
[program:fastapi]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/fastapi
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Node.js Gateway: HTTP/WS on $PORT (Render's exposed port)
# GRPC_TARGET=localhost:50051 — FastAPI gRPC in this same container
[program:gateway]
command=node src/index.js
directory=/app/gateway
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
